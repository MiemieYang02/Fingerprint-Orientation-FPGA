name: 问题反馈 / Bug report
description: 反馈你遇到的问题 / Report the issue you are experiencing
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请清楚描述你遇到的问题
      placeholder: 例如：运行仿真时出现 FileNotFoundError...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出如何复现这个问题
      placeholder: |
        1. 打开...
        2. 运行...
        3. 出现错误...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你原本希望它如何工作？
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请填写系统、软件版本、硬件平台等
      placeholder: |
        OS: Windows 11
        Vivado: 2025.2
        Board: Artix-7
    validations:
      required: false